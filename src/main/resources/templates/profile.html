<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trang cá nhân</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
        }
        .profile-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 40px;
            margin-top: 60px;
            max-width: 500px;
        }
        .profile-card h2 {
            color: #333;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .profile-info {
            font-size: 16px;
            color: #555;
        }
        .profile-info strong {
            color: #333;
        }
        .btn-logout {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: none;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            color: #fff;
        }
        .btn-logout:hover {
            opacity: 0.9;
            color: #fff;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="profile-card text-center">
            <h2>👤 Trang Cá Nhân</h2>
            <img id="images" class="avatar" src="https://via.placeholder.com/100" alt="Avatar">
            <div class="profile-info mb-2">
                <strong>Họ tên: </strong><span id="profileName">Loading...</span>
            </div>
            <div class="profile-info mb-2">
                <strong>Email: </strong><span id="profileEmail">Loading...</span>
            </div>
            <div class="profile-info mb-4">
                <strong>Ngày tạo: </strong><span id="profileCreated">Loading...</span>
            </div>
            <button id="Logout" class="btn btn-logout">🚪 Đăng Xuất</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/mainjs.js"></script>
</body>
</html>
